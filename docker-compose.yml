version: '3.8'

services:
  redis:
    image: redis:alpine
    ports:
      - "6379:6379"

  express-server:
    build:
      context: ./apps/express-server
    ports:
      - "3000:3000"
    environment:
      - REDIS_URL=redis://redis:6379
      - PORT=3000
    depends_on:
      - redis

  websocket-server:
    build:
      context: ./apps/websocket-server
    ports:
      - "5000:5000"
      - "5001:5001"
    environment:
      - REDIS_URL=redis://redis:6379
      - GEMINI_API_KEY=${GeminiAPI}
      - PORT=5000
    depends_on:
      - redis

  worker:
    build:
      context: ./apps/worker
    environment:
      - REDIS_URL=redis://redis:6379
    volumes:
      # Gives the worker access to spawn sibling containers on the host
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - redis
      